# ============================================
# 金蝶云星空 8.2.0 开票流程自动化 - 配置
# ============================================

browser:
  # 调试浏览器地址（由「启动调试浏览器.bat」启动，端口 9222）
  cdp_url: "http://127.0.0.1:9222"
  # 操作超时（毫秒）。金蝶服务端慢，别调太小
  timeout: 15000
  # 每步操作后的等待（毫秒），避免金蝶卡顿导致填错
  step_wait: 800

kingdee:
  # 金蝶云星空地址（登录后填入，例如 http://erp.xxx.com/k3cloud/html5/index.aspx）
  base_url: "https://tlym.ik3cloud.com/k3cloud"
  # 账套 / 数据中心（登录页选择，若脚本需自动登录才用，接管模式不需要）
  data_center: ""
  user: ""

rules:
  # 默认日期区间规则：上月26号 ~ 当月25号（用于出库单列表过滤，字段 FDate1=账务日期）
  # Excel 里「日期区间例外」列填了就以 Excel 为准，留空则用这里
  default_date_range: "上月26号~当月25号"

  # ---- 应收单业务日期规则（2026-09-18 用户确认）----
  # 业务口径：每月初处理【上月】的账 → 业务日期填【上月末】
  #   例：10月初处理9月单据 → 2026-09-30
  # 演示期（现在9月，提前做）→ 用 "本月最后一天" = 2026-09-30
  # 正式投产后改成 "上月最后一天"
  # 可选值：上月最后一天 / 本月最后一天 / manual(用下面的固定值) / ""(不改)
  receivable_biz_date: "本月最后一天"
  # 兜底值：仅当上面设为 manual 时用这个固定日期（留空则不改业务日期）
  receivable_biz_date_fixed: ""

  # 实测：改 FDATE 后 FENDDATE_H(到期日) 会自动联动，不需要单独设

  # ---- 明细行口径（2026-09-18 用户确认：每个物料一行）----
  # 出库单 N 个物料 → 应收单 N 行明细，不在出库单下推环节合并
  # 合并在「应收单 → 下推发票」这一步做（选分录合并）
  detail_rule: "每物料一行"

  # 应收单下推发票时的模式（已确认：合并）
  invoice_merge: "分录合并"
  # 非合并模式时使用的菜单项（备用）
  invoice_merge_alt: "分录不合并"

  # 开票方式（已确认：票在电子税务局开 → 金蝶为事后补录，开票方式=手工）
  invoice_mode: "手工"
  # 增值税专用发票「复核人」（kdcombo，字段 F_PAEZ_COMBO，必填项，界面带红色 *）
  # 2026-09-18 用户指定：姚玉平
  # 可选值实测：蒙晓芳/刘启丽/陈聪/张婷/杨蓉/姚玉平/区志婷/廖惠娇/李佩瑶
  invoice_checker: "姚玉平"
  # 需要填进金蝶发票单据的字段（已确认：发票号码不填）
  backfill_fields:
    - 开票人
    - 复核人
    - 业务日期
    - 发票日期

  # 立账类型（待确认：业务应收 / 暂估应收）
  receivable_type: ""

  # 凭证摘要规则
  # ★ 用户口径（2026-09-21）：摘要**从开票数据.xlsx 的「摘要」列取数**，三行分录统一成同一句。
  #   但本期先 **保留系统原值**（不启用），所以下面 digest_enabled = false。
  #   待办：启用后按「客户 + 月份」在 Excel 里匹配对应行的摘要，写入凭证分录。
  digest_enabled: false       # ★待办：true = 真正改摘要
  digest_source: "excel"      # excel = 取 Excel「摘要」列；template = 用 digest_template
  digest_scope: "all_rows"    # all_rows = 所有非空摘要行统一改；也可写 "0,1,2"
  # 兜底模板（Excel 没有摘要列时用），支持占位符：{客户} {月份} {发票号}
  digest_template: ""

safety:
  # ============ 安全护栏：默认全关 ============
  # 只做到「保存/暂存」为止，不提交不审核，人工核对后再开
  auto_submit: false          # 自动点「提交」
  auto_audit: false           # 自动点「审核」
  auto_voucher: false         # 自动生成凭证
  auto_voucher_save: false    # 自动保存凭证
  # ★★ 红线：不能删除凭证（用户 2026-09-21 定）
  #   这一条**不是开关** —— 没有对应字段可改，硬编码在 common.Guard.FORBIDDEN 里，
  #   开任何开关、传 --yes 都放不开。凭证是账务链路的终态留痕，删除不可逆且无回收站。
  #   要改凭证：走「凭证 - 修改」页改摘要/分录后保存，或反审核后重做 —— 一律不删。
  # 生成凭证之后清场：关掉所有标签页，只留「销售出库单列表」（下一组起点）
  # 金蝶 SPA 会把开过的页面 DOM 留在 document 里，标签越多越容易点到「隐藏页面」
  # 的按钮/列表 —— 见 docs/界面结构速查.md「全局规律」
  clean_tabs_after_voucher: true
  # 出错立即停止，绝不猜着往下走
  stop_on_error: true
  # 每步截图存档
  screenshot_every_step: true
  # 单条处理上限（防止跑飞），0 = 不限
  max_rows: 0
  # 从第几行开始（断点续跑用），1 = 从头
  start_row: 1

paths:
  excel: "data/开票数据.xlsx"
  sheet: "开票数据"
  screenshots: "output/screenshots"
  logs: "output/logs"
  capture: "output/capture"
  result: "output/结果回写.xlsx"
